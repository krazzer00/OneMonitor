[package]
name = "onemonitor"
version = "0.2.2"
description = "Tray monitor for OneProvider / OpenRouter status & balance and ChatGPT / Claude / Antigravity subscription limits"
authors = ["OneMonitor"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "onemonitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the bundled frontend (what `tauri build` enables); required for plain `cargo build`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
dirs = "6"
futures = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Dwm",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
] }
winreg = "0.55"
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
