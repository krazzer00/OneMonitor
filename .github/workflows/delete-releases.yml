name: Delete releases

# Manual clean-up of broken releases (and their tags).
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to delete, e.g. v0.1.0 v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $TAGS; do
            case "$tag" in v[0-9]*) ;; *) echo "skip invalid tag: $tag"; continue ;; esac
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes \
              && echo "deleted $tag" || echo "not found: $tag"
          done
