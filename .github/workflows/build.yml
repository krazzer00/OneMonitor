name: Build portable (Windows)

on:
  # Branches with a PR are built once, through pull_request; pushes build
  # only main and release tags.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0); the tag is created on the built commit"
        required: false
        default: ""
      delete_releases:
        description: "Only delete these releases and their tags (space-separated, e.g. v0.1.0 v0.1.1)"
        required: false
        default: ""

permissions:
  contents: write

# A newer push supersedes an unfinished build of the same ref; manual release
# and clean-up runs get their own group and are never cancelled.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || inputs.delete_releases || 'ci' }}
  cancel-in-progress: ${{ !inputs.release_tag && !inputs.delete_releases }}

jobs:
  delete-releases:
    if: ${{ inputs.delete_releases }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.delete_releases }}
        run: |
          for tag in $TAGS; do
            case "$tag" in v[0-9]*) ;; *) echo "skip invalid tag: $tag"; continue ;; esac
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes \
              && echo "deleted $tag" || echo "not found: $tag"
          done

  windows:
    if: ${{ !inputs.delete_releases }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/onemonitor.exe dist/OneMonitor.exe
          Compress-Archive -Path dist/OneMonitor.exe -DestinationPath dist/OneMonitor-portable-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OneMonitor-portable-win-x64
          path: dist/OneMonitor.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: OneMonitor ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/OneMonitor-portable-win-x64.zip
          generate_release_notes: true
