name: Build portable (Windows)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0); the tag is created on main"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/onemonitor.exe dist/OneMonitor.exe
          Compress-Archive -Path dist/OneMonitor.exe -DestinationPath dist/OneMonitor-portable-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OneMonitor-portable-win-x64
          path: dist/OneMonitor.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: OneMonitor ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.release_tag && 'main' || github.sha }}
          files: dist/OneMonitor-portable-win-x64.zip
          generate_release_notes: true
